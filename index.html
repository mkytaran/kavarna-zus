<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a2c11">
  <title>ZUŠ Káva</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>☕ Kávovník ZUŠ</h1>
    </header>

    <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
    <section id="login-view">
      <div class="input-group">
        <label for="user-select">Kdo pije kávu?</label>
        <select id="user-select">
          <option value="" disabled selected>Vyber své jméno...</option>
        </select>
      </div>

      <div class="input-group">
        <label for="user-pin">Čtyřmístný PIN</label>
        <input type="password" id="user-pin" inputmode="numeric" maxlength="4" placeholder="****">
      </div>

      <button id="login-btn" class="btn">Vstoupit do kavárny</button>
    </section>

    <!-- HLAVNÍ UŽIVATELSKÁ OBRAZOVKA -->
    <section id="main-view" class="hidden">
      <div class="user-status">
        <div class="progress-text" id="cup-counts">0 / 20</div>
        <div class="sub-text">vyčerpáno z předplatného</div>
      </div>

      <!-- Interaktivní vektorový šálek -->
      <div class="cup-wrapper">
        <svg id="coffee-cup" class="cup-interactive" viewBox="0 0 100 100">
          <!-- Talířek -->
          <ellipse cx="50" cy="85" rx="35" ry="7" fill="#c89d7c" />
          <!-- Ucho hrnku -->
          <path d="M 65 35 C 85 35, 85 65, 65 65" fill="none" stroke="#e8d8c8" stroke-width="6" stroke-linecap="round" />
          <!-- Tělo hrnku -->
          <path d="M 25 30 L 32 75 C 33 80, 67 80, 68 75 L 75 30 Z" fill="#e8d8c8" />
          <!-- Káva uvnitř hrnku -->
          <ellipse id="liquid" cx="50" cy="35" rx="23" ry="7" fill="#442617" />
          <ellipse cx="50" cy="35" rx="20" ry="5" fill="#d97443" opacity="0.3" id="crema-ring"/>
        </svg>
        <div class="cup-hint" id="cup-action-text">Klepnutím vypiješ kávu ☕</div>
      </div>

      <!-- Kasa a přehled -->
      <div class="treasury-card">
        <h3>Stav sborovní pokladny</h3>
        <div class="finance-grid">
          <div class="finance-item">
            <span>Vybráno:</span>
            <strong id="fin-vybrano">0 Kč</strong>
          </div>
          <div class="finance-item">
            <span>Nákup + doprava:</span>
            <strong id="fin-vydaje">0 Kč</strong>
          </div>
          <div class="finance-balance">
            <span>Zůstatek fondu:</span>
            <strong id="fin-rozdil">0 Kč</strong>
          </div>
        </div>
      </div>

      <button id="admin-switch-btn" class="btn btn-secondary hidden">Správa předplatného</button>
      <button id="logout-btn" class="btn btn-secondary">Odhlásit</button>
    </section>

    <!-- ADMIN OBRAZOVKA -->
    <section id="admin-view" class="hidden">
      <h2>Správa kafařů</h2>
      <div style="overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Jméno</th>
              <th>Předpl.</th>
              <th>Vypito</th>
              <th>Uložit</th>
            </tr>
          </thead>
          <tbody id="admin-user-list"></tbody>
        </table>
      </div>
      <button id="admin-back-btn" class="btn btn-secondary">Zpět na přehled</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
